[workspace]
members = [
    "crates/audio-worklet",
    "crates/hrtf",
    "crates/web",
    "server",
    "tools/hrtf-convert",
]
default-members = ["server"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
glam = "0.30"
rustfft = "6.2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
wgpu = { version = "30.0.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
